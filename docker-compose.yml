services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf.template:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      ecommerce-app:
        condition: service_started
    environment:
      SERVER_NAME: ${SERVER_NAME}
      TLS_CERT_NAME: ${TLS_CERT_NAME}
    command: ["/bin/sh", "-c", "envsubst '$$SERVER_NAME $$TLS_CERT_NAME' < /etc/nginx/nginx.conf.template > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    command: ["certificates"]   # harmless default so `docker compose up` doesn't hang; real cert requests use `docker compose run certbot ...`
    networks:
      - app-network

  ecommerce-app:
    image: registry.digitalocean.com/ecom-next-registry/ecommerce-app:latest
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app-network

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  migrate:
    image: postgres:16
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["sh", "-c"]
    command: ["for migration in /migrations/*.sql; do PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h postgres -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -f \"$$migration\"; done"]
    networks:
      - app-network

volumes:
  pgdata:
  certbot-etc:
  certbot-www:

networks:
  app-network:
    driver: bridge