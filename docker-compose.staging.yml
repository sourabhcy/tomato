services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy-staging
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ecommerce-app
    networks:
      - app-network-staging

  ecommerce-app:
    # Image is built separately (see scripts/deploy-staging.sh) since it needs
    # the full repo as build context, not just the files copied to DEPLOY_DIR.
    image: ecommerce-app:staging
    container_name: ecommerce-app-staging
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env.staging
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
    depends_on:
      - postgres
    networks:
      - app-network-staging

  postgres:
    image: postgres:16
    container_name: postgres-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata-staging:/var/lib/postgresql/data
    networks:
      - app-network-staging

volumes:
  pgdata-staging:

networks:
  app-network-staging:
    driver: bridge
